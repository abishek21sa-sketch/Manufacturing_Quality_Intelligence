ronment and operator factor stratification, with explicit external/reference data mode and claim boundary.","required_inputs":["part / line / quality characteristic","validated source/provenance","current constraints/state"],"decision_output":"Auditable entity / factor explorer evidence for inspection / containment / corrective-action policy","operator_action":"Quality Engineer reviews the Entity / Factor Explorer evidence, drills into the responsible part / line / quality characteristic, then approves, holds or escalates the inspection / containment / corrective-action policy."},{"workspace":"Empirical Case Study","engineering_question":"Which defect classes consume the most economic quality risk under limited inspection capacity?","method":"Steel-plate fault escape study from defect signal to adaptive inspection allocation","evidence":"Evidence object: Steel-plate fault escape study from defect signal to adaptive inspection allocation, with explicit external/reference data mode and claim boundary.","required_inputs":["part / line / quality characteristic","validated source/provenance","current constraints/state"],"decision_output":"Auditable empirical case study evidence for inspection / containment / corrective-action policy","operator_action":"Quality Engineer reviews the Empirical Case Study evidence, drills into the responsible part / line / quality characteristic, then approves, holds or escalates the inspection / containment / corrective-action policy."},{"workspace":"External Validation","engineering_question":"When does poor measurement quality make inspection less valuable than containment?","method":"Public fault-data refresh and transfer validation for risk/inspection methods","evidence":"Evidence object: Public fault-data refresh and transfer validation for risk/inspection methods, with explicit external/reference data mode and claim boundary.","required_inputs":["part / line / quality characteristic","validated source/provenance","current constraints/state"],"decision_output":"Auditable external validation evidence for inspection / containment / corrective-action policy","operator_action":"Quality Engineer reviews the External Validation evidence, drills into the responsible part / line / quality characteristic, then approves, holds or escalates the inspection / containment / corrective-action policy."},{"workspace":"Data Refresh","engineering_question":"Is the current analytical state fresh enough to support the inspection / containment / corrective-action decision?","method":"Versioned UCI refresh, checksum, schema drift and model/policy revalidation","evidence":"Evidence object: Versioned UCI refresh, checksum, schema drift and model/policy revalidation, with explicit external/reference data mode and claim boundary.","required_inputs":["part / line / quality characteristic","validated source/provenance","current constraints/state"],"decision_output":"Auditable data refresh evidence for inspection / containment / corrective-action policy","operator_action":"Quality Engineer reviews the Data Refresh evidence, drills into the responsible part / line / quality characteristic, then approves, holds or escalates the inspection / containment / corrective-action policy."},{"workspace":"Containment Campaign","engineering_question":"Which inspection policy remains defensible as defect predictions and gage evidence vary?","method":"Multi-seed boosted defect risk + GAGE-SHIELD allocation with ECON-SPC-P escalation","evidence":"Selected-line stability, Brier score, capacity use and expected uninspected escape exposure","required_inputs":["line / shift / gage / inspection action","validated empirical/reference evidence","current decision constraints"],"decision_output":"Auditable containment campaign evidence for inspection / containment policy decision","operator_action":"Deploy only stable capacity-feasible inspection actions."},{"workspace":"Escape-Cost Frontier","engineering_question":"What expected quality escape expos pace;document.getElementById('qc-question').textContent=w.engineering_question;document.getElementById('qc-method').textContent=w.method;document.getElementById('qc-evidence').textContent=w.evidence;document.getElementById('qc-action').textContent=w.operator_action;document.querySelectorAll('#qc-nav button').forEach((b,j)=>b.classList.toggle('sel',i===j))}QWS.forEach((w,i)=>{let b=document.createElement('button');b.dataset.workspace=w.workspace;b.textContent=w.workspace;b.onclick=()=>qPick(i);document.getElementById('qc-nav').appendChild(b)});qPick(0);for(let i=0;i<22;i++){let p=document.createElement('i');p.className='qc-point'+(i===16?' bad':'');p.style.left=(2+i*4.25)+'%';p.style.top=(38+Math.sin(i*.8)*18+(i===16?-23:0))+'%';document.getElementById('qc-points').appendChild(p)}async function qj(u){return (await fetch(u)).json()}Promise.all([qj('/api/ml/lifecycle'),qj('/api/agent/run'),qj('/api/airlines15x/empirical')]).then(([l,a,e])=>{document.getElementById('qc-source').textContent='data: '+((e.public_data_backbone&&[e.public_data_backbone.dataset_state,(e.public_data_backbone.primary_files?.[0]?.rows??'no-rows')+' rows',(e.public_data_backbone.primary_files?.[0]?.features??'')+' fields'].filter(Boolean).join(' | '))||e.data_mode||e.source_mode||'reference');document.getElementById('qc-model').textContent=l.registry_state;document.getElementById('qc-policy').textContent=a.decision_state;document.getElementById('qc-state').textContent=a.decision_state;document.getElementById('qc-spread').textContent=Number(l.risk_score_spread||0).toFixed(2);document.getElementById('qc-plan').innerHTML=a.chosen_tool_sequence.map(x=>'<li>'+x+'</li>').join('')});
